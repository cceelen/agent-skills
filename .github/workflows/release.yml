name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # make the GitHub release
      id-token: write # sign the provenance with the identity of this workflow
      attestations: write # store the provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Make sure that the tag is the version of the project
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(uv version --short)"
      - run: uv run pytest -q
      - name: Make the archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="agent-skills-$TAG/" -o "agent-skills-$TAG.tar.gz" "$TAG"
          sha256sum "agent-skills-$TAG.tar.gz" > "agent-skills-$TAG.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: agent-skills-${{ github.ref_name }}.tar.gz
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "agent-skills-$TAG.tar.gz" "agent-skills-$TAG.tar.gz.sha256" --title "$TAG" --notes-file CHANGELOG.md --verify-tag
