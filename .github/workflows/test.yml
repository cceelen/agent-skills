name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # the upload to Codecov proves its origin with OIDC; no token is stored
    strategy:
      fail-fast: false
      matrix:
        # One version is the goal: the latest stable Python. 3.9 stays only until the programs of
        # the skill library-vetting are migrated; see the migration issue.
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # uv.lock has the tools for Python 3.10 and later. Python 3.9 gets the last pytest for it.
      - if: matrix.python == '3.9'
        run: uv run --python 3.9 --no-project --with pytest==8.4.2 pytest -q
      - if: matrix.python != '3.9'
        run: uv run --python ${{ matrix.python }} pytest -q
        env:
          COVERAGE_XML: coverage.xml
      # Only the newest Python measures the coverage. A pull request from a fork has no OIDC
      # token; Codecov accepts its report without one, because the repository is public.
      - if: matrix.python == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: true
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run pre-commit run --all-files
