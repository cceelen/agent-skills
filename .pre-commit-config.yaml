# Run all hooks: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Spec Kit generates and refreshes these files; an edit here is overwritten on upgrade.
        exclude: ^\.specify/workflows/
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: debug-statements
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # buildd: the name of the Debian build daemon. technik, oder: German words in the
        # quotes of an evidence record.
        args: [--ignore-words-list, "ans,thirdparty,errorprone,buildd,technik,oder"]
        # .specify/scripts/: generated by Spec Kit; an edit is overwritten on upgrade.
        exclude: ^(uv\.lock|tests/.*/fixture/.*|\.specify/scripts/.*)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        # Generated by Spec Kit; an edit is overwritten on upgrade.
        exclude: ^\.specify/scripts/
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
