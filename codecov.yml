# Codecov tracks the coverage of the programs in factory/ on each branch and each pull request.
# The CI sends the report (.github/workflows/test.yml). The minimum for a commit is in
# pyproject.toml; these rules compare a change with its base.
codecov:
  branch: main
  require_ci_to_pass: true

coverage:
  precision: 1
  round: down
  range: "80...100"
  status:
    # The coverage of the whole project must not decrease by more than one point.
    project:
      default:
        target: auto
        threshold: 1%
    # The lines that a pull request adds or changes need this coverage.
    patch:
      default:
        target: 90%

# The comment in a pull request shows the change of the project coverage also, not only the
# coverage of the changed lines.
# Recipe: https://docs.codecov.com/docs/common-recipe-list (read on 2026-10-09)
comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false # post the comment also when the coverage did not change
  require_base: false # post the comment also when the base has no report
  require_head: true # the head must have a report
  hide_project_coverage: false # show the coverage of the project and of the changed lines

ignore:
  - "tests/**"
