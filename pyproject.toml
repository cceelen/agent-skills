[project]
name = "agent-skills"
version = "1.0.0"
description = "Agent skills in the open SKILL.md format"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PIE", "RUF"]
ignore = ["UP015"]
